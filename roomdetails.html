<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Property Details · TingoRooms</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />

    <style>
        /* ============================================================
           PROFESSIONAL SPLIT-SCREEN DESIGN SYSTEM
           ============================================================ */
        :root {
            --primary: #111827;
            --brand-red: #E11D48;
            --brand-red-hover: #BE123C;
            
            --surface: #FFFFFF;
            --surface-alt: #F9FAFB;
            
            --text: #111827;
            --text-secondary: #4B5563;
            --text-muted: #9CA3AF;

            --border: #E5E7EB;
            --border-light: #F3F4F6;

            --success: #059669;
            --success-soft: #D1FAE5;

            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;

            --header-h: 72px;
            --transition: 0.2s ease-in-out;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--surface);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            position: sticky;
            top: 0;
            height: var(--header-h);
            display: flex;
            align-items: center;
            padding: 0 5%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            gap: 16px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text);
            border: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
        }
        .back-btn:hover {
            background: var(--surface-alt);
            border-color: #D1D5DB;
        }

        .header-title {
            font-weight: 700;
            font-size: 16px;
            color: var(--text);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-badge {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            background: var(--success);
        }

        /* ============================================================
           MAIN LAYOUT (SPLIT SCREEN FOR DESKTOP)
           ============================================================ */
        .main {
            max-width: 1440px;
            margin: 0 auto;
            padding: 40px 5%;
            width: 100%;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1.1fr 1fr; /* 55% Image / 45% Info */
            gap: 60px;
            align-items: start;
        }

        /* ============================================================
           LEFT SIDE: MEDIA COLUMN (STICKY)
           ============================================================ */
        .media-column {
            position: sticky;
            top: calc(var(--header-h) + 40px);
            height: calc(100vh - var(--header-h) - 80px); /* Fill available height */
            min-height: 500px;
        }

        .gallery-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .gallery-track {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .gallery-track::-webkit-scrollbar { display: none; }

        .gallery-slide {
            min-width: 100%;
            height: 100%;
            scroll-snap-align: center;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .gallery-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Fully visible */
            z-index: 2;
        }
        
        .gallery-slide::before {
            content: '';
            position: absolute;
            top: -10%; left: -10%; right: -10%; bottom: -10%;
            background: inherit;
            filter: blur(30px) brightness(0.4);
            z-index: 1;
        }

        .gallery-dots {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 20px;
        }
        .gallery-dots .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transition: all var(--transition);
            cursor: pointer;
            border: none;
            padding: 0;
        }
        .gallery-dots .dot.active {
            background: #fff;
            transform: scale(1.5);
        }

        .gallery-counter {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            z-index: 10;
        }

        .gallery-placeholder {
            width: 100%;
            height: 100%;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 15px;
            gap: 12px;
        }
        .gallery-placeholder .material-symbols-rounded {
            font-size: 48px;
            color: #D1D5DB;
        }

        /* ============================================================
           RIGHT SIDE: INFO COLUMN
           ============================================================ */
        .info-column {
            display: flex;
            flex-direction: column;
        }

        .info-section {
            padding-bottom: 32px;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border);
        }
        .info-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .room-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
            color: var(--text);
            margin-bottom: 12px;
        }
        
        .room-location {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            font-size: 16px;
        }
        .room-location .material-symbols-rounded {
            font-size: 20px;
            color: var(--text-muted);
        }

        .price-group {
            margin-top: 24px;
            display: flex;
            align-items: flex-end;
            gap: 32px;
        }
        .rent-price {
            font-size: 36px;
            font-weight: 800;
            color: var(--text);
            line-height: 1;
        }
        .rent-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-top: 8px;
        }
        .deposit-price {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .tags-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 24px;
        }
        .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-alt);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid var(--border);
        }
        .tag .material-symbols-rounded {
            font-size: 18px;
            color: var(--text-secondary);
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 16px;
        }
        .description-text {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.7;
            white-space: pre-wrap;
        }

        #map {
            height: 280px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface-alt);
            z-index: 1;
        }
        .map-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 280px;
            color: var(--text-muted);
            background: var(--surface-alt);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            gap: 8px;
        }

        /* ============================================================
           ACTION BUTTONS (Integrated in Info Column for Desktop)
           ============================================================ */
        .action-sidebar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-top: 32px;
        }

        .action-sidebar .action-btn {
            border: none;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            padding: 16px;
            cursor: pointer;
            transition: opacity var(--transition);
        }
        .action-sidebar .action-btn:hover {
            opacity: 0.9;
        }

        .action-btn.call { background: var(--primary); }
        .action-btn.whatsapp { background: #16A34A; }
        .action-btn.chat { background: var(--brand-red); }

        /* ============================================================
           LOADING
           ============================================================ */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 40vh;
            gap: 16px;
            color: var(--text-secondary);
        }
        .loading-state .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }

        /* ============================================================
           MOBILE RESPONSIVENESS
           ============================================================ */
        @media (max-width: 960px) {
            .main {
                padding: 24px 5% 100px 5%;
            }
            .content-grid {
                grid-template-columns: 1fr;
                gap: 32px;
            }
            
            .media-column {
                position: relative;
                top: 0;
                height: auto;
                min-height: auto;
            }
            .gallery-wrap {
                aspect-ratio: 4 / 3;
                border-radius: var(--radius-sm);
            }

            .room-title { font-size: 26px; }
            .rent-price { font-size: 32px; }
            
            .info-section {
                padding-bottom: 24px;
                margin-bottom: 24px;
            }

            /* Mobile Bottom Fixed Bar */
            .action-sidebar {
                position: fixed;
                bottom: 0; left: 0; right: 0;
                margin: 0;
                display: flex;
                padding: 12px 16px;
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(12px);
                border-top: 1px solid var(--border);
                gap: 12px;
                z-index: 2000;
            }
            .action-sidebar .action-btn {
                flex: 1;
                padding: 14px 8px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .header { padding: 0 16px; }
            .main { padding: 16px 16px 90px 16px; }
            .gallery-wrap { aspect-ratio: 1 / 1; }
            .price-group { flex-direction: column; align-items: flex-start; gap: 12px; }
        }
    </style>
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <button class="back-btn" onclick="history.back()" aria-label="Go back">
            <span class="material-symbols-rounded">arrow_back</span>
        </button>
        <span class="header-title" id="headerTitle">Property Details</span>
        <span class="header-badge" id="headerBadge">Active</span>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main" id="mainContent">

        <!-- Loading State -->
        <div class="loading-state" id="loadingState">
            <div class="spinner"></div>
            <p>Loading details…</p>
        </div>

        <!-- Main Layout Grid -->
        <div class="content-grid hidden" id="contentGrid">

            <!-- Left Side: Image Gallery -->
            <div class="media-column">
                <div class="gallery-wrap hidden" id="galleryWrap">
                    <div class="gallery-track" id="galleryTrack"></div>
                    <div class="gallery-dots" id="galleryDots"></div>
                    <div class="gallery-counter" id="galleryCounter">1 / 1</div>
                </div>
                <div class="gallery-placeholder hidden" id="galleryPlaceholder">
                    <span class="material-symbols-rounded">photo_library</span>
                    <span>No images available</span>
                </div>
            </div>

            <!-- Right Side: Details & Actions -->
            <div class="info-column">
                
                <!-- Title & Price -->
                <div class="info-section">
                    <h1 class="room-title" id="roomTitle">Loading…</h1>
                    <div class="room-location">
                        <span class="material-symbols-rounded">location_on</span>
                        <span id="roomLocation">Location</span>
                    </div>

                    <div class="price-group">
                        <div>
                            <div class="rent-price" id="roomRent">₹ 0</div>
                            <div class="rent-label" id="rentLabel">Per Month</div>
                        </div>
                        <div>
                            <div class="deposit-price" id="roomDeposit">₹ 0</div>
                            <div class="rent-label" id="depositLabel">Security Deposit</div>
                        </div>
                    </div>

                    <div class="tags-row" id="roomTags"></div>

                    <!-- Action Sidebar (Appears inline on Desktop, Fixed bottom on Mobile) -->
                    <div class="action-sidebar hidden" id="actionSidebar">
                        <!-- Buttons injected by JavaScript -->
                    </div>
                </div>

                <!-- Description -->
                <div class="info-section">
                    <div class="section-title" id="descTitle">About Property</div>
                    <div class="description-text" id="roomDesc">No description provided.</div>
                </div>

                <!-- Map -->
                <div class="info-section" style="border-bottom: none;">
                    <div class="section-title">Location Overview</div>
                    <div id="map"></div>
                </div>

            </div>

        </div>

    </main>

    <script>
        // ================================================================
        //  SUPABASE & CORE STATE
        // ================================================================
        const SUPABASE_URL = "https://slhbrakvprrxtqzodcyy.supabase.co";
        const SUPABASE_KEY =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsaGJyYWt2cHJyeHRxem9kY3l5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5Mzk4NzksImV4cCI6MjA5MTUxNTg3OX0.zygNCH4m_Zoz0ybgoyhlQKySHkV_uuFHAEhzqG5WRZ0";

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let totalImages = 0;

        // Auto Slider State
        let autoSlideInterval = null;
        let currentSlideIndex = 0;

        // ================================================================
        //  URL PARAMS
        // ================================================================
        const params = new URLSearchParams(window.location.search);
        const roomId =
            params.get("id") || params.get("room") || params.get("post_id") || params.get("requirement_id");
        const requestedType = String(
            params.get("type") || params.get("post_type") || params.get("listing_type") || ""
        ).toLowerCase();

        if (!roomId || roomId === "null" || roomId === "undefined") {
            alert("Invalid post ID. Returning to home.");
            window.location.href = "index.html";
        } else {
            loadRoom();
        }

        // ================================================================
        //  HELPERS
        // ================================================================
        function isTruthy(value) {
            if (value === true || value === 1) return true;
            const v = String(value || "").trim().toLowerCase();
            return v === "true" || v === "1" || v === "yes" || v === "y";
        }

        function firstValue(obj, keys, fallback = "") {
            for (const key of keys) {
                if (obj && obj[key] !== undefined && obj[key] !== null && String(obj[key]).trim() !== "") {
                    return obj[key];
                }
            }
            return fallback;
        }

        function money(value, fallback = "Not mentioned") {
            if (value === undefined || value === null || String(value).trim() === "") return fallback;
            const num = Number(value);
            if (!isNaN(num)) return "₹ " + num.toLocaleString("en-IN");
            return "₹ " + value;
        }

        function cleanPhone(number) {
            return String(number || "").replace(/[^\d]/g, "");
        }

        function escapeHtml(value) {
            return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function getTableCandidates() {
            const available = [{ table: "room_posts", kind: "available" }];
            const needed = [
                { table: "room_requirements", kind: "needed" }, { table: "room_requirement", kind: "needed" },
                { table: "rooms_needed", kind: "needed" }, { table: "room_needed", kind: "needed" },
                { table: "room_needs", kind: "needed" }, { table: "needed_rooms", kind: "needed" },
                { table: "requirement_posts", kind: "needed" }, { table: "requirements", kind: "needed" }
            ];
            if (requestedType.includes("need") || requestedType.includes("require") || requestedType.includes("wanted")) {
                return [...needed, ...available];
            }
            return [...available, ...needed];
        }

        function normalizeRoom(raw, kind, sourceTable) {
            const detectedKind = String(firstValue(raw, ["post_type", "listing_type", "category_type"], kind)).toLowerCase();
            const isNeeded = kind === "needed" || detectedKind.includes("need") || detectedKind.includes("require") || detectedKind.includes("wanted");

            return {
                raw, id: firstValue(raw, ["id", "post_id", "requirement_id"]), sourceTable, postKind: isNeeded ? "needed" : "available",
                user_id: firstValue(raw, ["user_id", "posted_by", "owner_id", "created_by", "seeker_id"]),
                title: firstValue(raw, ["title", "post_title", "requirement_title", "room_title"], isNeeded ? "Room Requirement" : "Room Details"),
                location: firstValue(raw, ["location", "preferred_location", "area", "locality", "address", "city"], "Location not provided"),
                rent: firstValue(raw, ["rent", "budget", "max_budget", "monthly_budget", "expected_rent", "price", "amount"]),
                deposit: firstValue(raw, ["deposit", "security_deposit", "max_deposit", "expected_deposit"]),
                description: firstValue(raw, ["description", "details", "requirement", "requirements", "notes", "about"], "No additional details provided."),
                type: firstValue(raw, ["type", "room_type", "property_type", "preferred_type", "category"], isNeeded ? "Room Needed" : "Property"),
                images: firstValue(raw, ["images", "image_urls", "photos", "photo_urls"], ""),
                latitude: firstValue(raw, ["latitude", "lat"]), longitude: firstValue(raw, ["longitude", "lng", "lon"]),
                contact_number: firstValue(raw, ["contact_number", "contact", "phone", "mobile"]),
                show_contact: raw.show_contact !== undefined ? raw.show_contact : raw.show_phone !== undefined ? raw.show_phone : true,
                whatsapp_number: firstValue(raw, ["whatsapp_number", "whatsapp", "whatsapp_no"]),
                show_whatsapp: raw.show_whatsapp !== undefined ? raw.show_whatsapp : true,
                brokerage_type: firstValue(raw, ["brokerage_type", "brokerage"], ""),
                brokerage_amount: firstValue(raw, ["brokerage_amount", "brokerage_fee"], ""),
                status: firstValue(raw, ["status"], "active")
            };
        }

        // ================================================================
        //  LOAD ROOM
        // ================================================================
        async function loadRoom() {
            const candidates = getTableCandidates();
            for (const item of candidates) {
                try {
                    const { data, error } = await db.from(item.table).select("*").eq("id", roomId).maybeSingle();
                    if (data) {
                        renderRoom(normalizeRoom(data, item.kind, item.table));
                        return;
                    }
                } catch (err) { console.warn(`Skipped ${item.table}:`, err); }
            }
            alert("Post not found or has been removed.");
            window.location.href = "index.html";
        }

        // ================================================================
        //  RENDER
        // ================================================================
        function renderRoom(room) {
            const isNeeded = room.postKind === "needed";

            document.getElementById("loadingState").classList.add("hidden");
            document.getElementById("contentGrid").classList.remove("hidden");
            document.getElementById("actionSidebar").classList.remove("hidden");

            document.getElementById("headerTitle").innerText = isNeeded ? "Requirement Details" : "Property Details";
            document.getElementById("descTitle").innerText = isNeeded ? "About Requirement" : "About Property";

            const badge = document.getElementById("headerBadge");
            if (room.status && room.status !== "active" && room.status !== "approved") {
                badge.innerText = room.status || "Inactive";
                badge.style.background = "#D97706";
            } else {
                badge.innerText = "Active";
                badge.style.background = "var(--success)";
            }

            localStorage.setItem("last_roomdetails_post", JSON.stringify({ id: room.id, type: room.postKind, table: room.sourceTable }));

            // ---- IMAGES ----
            const track = document.getElementById("galleryTrack");
            const wrap = document.getElementById("galleryWrap");
            const dotsContainer = document.getElementById("galleryDots");
            const placeholder = document.getElementById("galleryPlaceholder");

            const images = (room.images && String(room.images).trim() !== "")
                ? String(room.images).split(",").map(x => x.trim()).filter(Boolean)
                : [];

            if (images.length === 0) {
                wrap.classList.add("hidden");
                placeholder.classList.remove("hidden");
                totalImages = 0;
            } else {
                wrap.classList.remove("hidden");
                placeholder.classList.add("hidden");
                totalImages = images.length;

                track.innerHTML = images.map(src => {
                    const cleanSrc = escapeHtml(src);
                    return `<div class="gallery-slide" style="--bg-url: url('${cleanSrc}')">
                                <img src="${cleanSrc}" loading="lazy" alt="Room image">
                            </div>`;
                }).join("");

                const styleSheet = document.createElement("style");
                styleSheet.innerText = `.gallery-slide::before { background-image: var(--bg-url); background-size: cover; background-position: center; }`;
                document.head.appendChild(styleSheet);

                dotsContainer.innerHTML = Array.from({ length: totalImages }, (_, i) =>
                    `<button class="dot ${i === 0 ? 'active' : ''}" data-index="${i}" aria-label="Image ${i+1}"></button>`
                ).join("");

                dotsContainer.querySelectorAll(".dot").forEach(dot => {
                    dot.addEventListener("click", function() {
                        stopAutoSlide();
                        goToSlide(parseInt(this.dataset.index));
                    });
                });

                track.addEventListener("scroll", () => { updateGalleryUI(); updateGalleryCounter(); });
                track.addEventListener("touchstart", stopAutoSlide, { passive: true });
                track.addEventListener("mousedown", stopAutoSlide, { passive: true });

                document.getElementById("galleryCounter").innerText = `1 / ${totalImages}`;
                if (totalImages > 1) startAutoSlide();
            }

            // ---- TEXT ----
            document.getElementById("roomTitle").innerText = room.title || "Untitled";
            document.getElementById("roomLocation").innerText = room.location || "Location not provided";

            if (isNeeded) {
                document.getElementById("roomRent").innerText = money(room.rent, "Budget not mentioned");
                document.getElementById("rentLabel").innerText = "Budget / Month";
                document.getElementById("roomDeposit").innerText = money(room.deposit, "Not mentioned");
                document.getElementById("depositLabel").innerText = "Deposit";
            } else {
                document.getElementById("roomRent").innerText = money(room.rent, "₹ 0");
                document.getElementById("rentLabel").innerText = "Per Month";
                document.getElementById("roomDeposit").innerText = money(room.deposit, "₹ 0");
                document.getElementById("depositLabel").innerText = "Security Deposit";
            }

            document.getElementById("roomDesc").innerText = room.description || "No additional details provided.";

            // ---- TAGS ----
            let tagsHtml = `
                <span class="tag">
                    <span class="material-symbols-rounded">${isNeeded ? "person_search" : "apartment"}</span>
                    ${escapeHtml(isNeeded ? "Room Needed" : room.type)}
                </span>
            `;

            if (isNeeded && room.type && room.type !== "Room Needed") {
                tagsHtml += `
                    <span class="tag">
                        <span class="material-symbols-rounded">category</span>
                        ${escapeHtml(room.type)}
                    </span>
                `;
            }

            if (!isNeeded && room.brokerage_type) {
                let bDisplay = room.brokerage_type;
                if ((room.brokerage_type === "Applicable" || room.brokerage_type === "Negotiable") && room.brokerage_amount) {
                    bDisplay += ` (${money(room.brokerage_amount)})`;
                }
                const isNoBroker = String(room.brokerage_type || "").toLowerCase().includes("no broker");
                tagsHtml += `
                    <span class="tag" style="${isNoBroker ? 'color: var(--success); background: var(--success-soft); border-color: transparent;' : ''}">
                        <span class="material-symbols-rounded">handshake</span>
                        ${escapeHtml(bDisplay)}
                    </span>
                `;
            }
            document.getElementById("roomTags").innerHTML = tagsHtml;

            // ---- MAP ----
            const lat = parseFloat(room.latitude);
            const lng = parseFloat(room.longitude);
            const mapContainer = document.getElementById("map");

            if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
                initMap(lat, lng);
            } else {
                mapContainer.innerHTML = `
                    <div class="map-placeholder">
                        <span class="material-symbols-rounded">location_off</span>
                        <span>Map location not provided</span>
                    </div>
                `;
            }

            renderActions(room);
        }

        // ================================================================
        //  GALLERY JS HELPERS
        // ================================================================
        function startAutoSlide() {
            if (autoSlideInterval) clearInterval(autoSlideInterval);
            autoSlideInterval = setInterval(() => {
                const track = document.getElementById("galleryTrack");
                if (!track) return;
                currentSlideIndex++;
                if (currentSlideIndex >= totalImages) currentSlideIndex = 0;
                goToSlide(currentSlideIndex);
            }, 3500);
        }

        function stopAutoSlide() {
            if (autoSlideInterval) { clearInterval(autoSlideInterval); autoSlideInterval = null; }
        }

        function goToSlide(idx) {
            const track = document.getElementById("galleryTrack");
            if (!track) return;
            const slideW = track.clientWidth || (track.scrollWidth / totalImages);
            track.scrollTo({ left: idx * slideW, behavior: "smooth" });
            currentSlideIndex = idx;
        }

        function updateGalleryUI() {
            const track = document.getElementById("galleryTrack");
            const dots = document.querySelectorAll(".dot");
            if (!dots.length || !track) return;
            const slideW = track.clientWidth || 1;
            const idx = Math.round(track.scrollLeft / slideW);
            currentSlideIndex = idx;
            dots.forEach((dot, i) => { dot.classList.toggle("active", i === idx); });
        }

        function updateGalleryCounter() {
            const track = document.getElementById("galleryTrack");
            const slideW = track.clientWidth || 1;
            const idx = Math.round(track.scrollLeft / slideW) + 1;
            document.getElementById("galleryCounter").innerText = `${idx} / ${totalImages}`;
        }

        // ================================================================
        //  MAP
        // ================================================================
        function initMap(lat, lng) {
            const container = document.getElementById("map");
            container.innerHTML = "";
            const map = L.map(container, { zoomControl: false }).setView([lat, lng], 14);
            L.control.zoom({ position: "bottomright" }).addTo(map);
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);
            L.marker([lat, lng]).addTo(map);
        }

        // ================================================================
        //  ACTIONS
        // ================================================================
        function renderActions(room) {
            const sidebar = document.getElementById("actionSidebar");
            let html = "";
            const phone = cleanPhone(room.contact_number);
            const whatsapp = cleanPhone(room.whatsapp_number || room.contact_number);

            if (isTruthy(room.show_contact) && phone) {
                html += `
                    <button class="action-btn call" onclick="window.location.href='tel:${phone}'">
                        <span class="material-symbols-rounded">call</span> Contact
                    </button>`;
            }
            if (isTruthy(room.show_whatsapp) && whatsapp) {
                html += `
                    <button class="action-btn whatsapp" onclick="window.open('https://wa.me/${whatsapp}', '_blank')">
                        <span class="material-symbols-rounded">chat</span> WhatsApp
                    </button>`;
            }
            if (room.user_id) {
                html += `
                    <button class="action-btn chat" onclick="startChat('${escapeHtml(room.user_id)}', '${escapeHtml(room.id)}', '${room.postKind}')">
                        <span class="material-symbols-rounded">forum</span> Chat
                    </button>`;
            }
            if (!html) {
                html = `
                    <button class="action-btn call" onclick="history.back()">
                        <span class="material-symbols-rounded">arrow_back</span> Back
                    </button>`;
            }
            sidebar.innerHTML = html;
        }

        // ================================================================
        //  CHAT REDIRECT
        // ================================================================
        function startChat(userId, postId, postKind) {
            const user = JSON.parse(localStorage.getItem("user"));
            if (user && user.id === userId) {
                alert(postKind === "needed" ? "This is your requirement." : "This is your property.");
                return;
            }
            if (!user) {
                localStorage.setItem("chat_redirect", JSON.stringify({ userId, roomId: postId, type: postKind }));
                alert("Please log in to chat.");
                window.location.href = "user.html";
                return;
            }
            window.location.href = `chat.html?user=${encodeURIComponent(userId)}&room=${encodeURIComponent(postId)}&source=roomdetails&type=${encodeURIComponent(postKind)}`;
        }

        document.addEventListener("DOMContentLoaded", () => {
            const track = document.getElementById("galleryTrack");
            if (track) {
                setTimeout(() => {
                    if (track.scrollLeft === 0) { updateGalleryUI(); updateGalleryCounter(); }
                }, 400);
            }
        });
    </script>
</body>
</html>
