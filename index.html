            return `
            <div class="card${girlsClass}" onclick="openRoom('${escapeHtml(req.id)}', 'requirement')">
                <div class="card-img-wrapper requirement-image" data-slide-count="1">
                    <span class="material-symbols-rounded ig-heart-btn">favorite</span>
                    <div class="card-price-badge">${rentText} <span>budget</span></div>
                    <span class="material-symbols-rounded req-icon">person_search</span>
                </div>
                <div class="card-content">
                    <div class="card-title-row">
                        <div class="card-title">${titleText}</div>
                    </div>
                    
                    <div class="card-address">
                        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                        <span>${fullAddress}</span>
                    </div>
                    
                    <div class="card-user-row">
                        <div class="card-user">
                            <img src="${escapeHtml(ownerAvatar)}" class="card-user-avatar" alt="">
                            <span class="card-user-name">Uploaded by ${escapeHtml(ownerName)}</span>
                        </div>
                        <div class="card-date">${dateText}</div>
                    </div>

                    <div class="card-meta-row">
                        <span class="meta-item">Seeking ${typeText}</span>
                        <span class="meta-dot">•</span>
                        <span class="meta-item">Status: ${escapeHtml(req.status || 'Active')}</span>
                        ${distanceHtml}
                    </div>
                </div>
            </div>`;
        };

        window.openRoom = function(id, source) {
            var finalSource = source === 'requirement' || activePostMode === 'needed' ? 'requirement' : 'available';
            if (finalSource === 'requirement') {
                window.location.href = 'roomdetails.html?id=' + encodeURIComponent(id) + '&source=requirement';
            } else {
                window.location.href = 'roomdetails.html?id=' + encodeURIComponent(id);
            }
        };

        window.triggerAction = function(event, type, roomId, info, source) {
            event.stopPropagation();
            var sourceParam = source === 'requirement' || activePostMode === 'needed' ? '&source=requirement' : '';
            window.location.href = 'roomdetails.html?id=' + encodeURIComponent(roomId) + sourceParam + '&auto=' + encodeURIComponent(type) + '&info=' + encodeURIComponent(info);
        };

        window.startChat = function(event, roomId, ownerId) {
            event.stopPropagation();
            localStorage.setItem('chat_redirect', JSON.stringify({ roomId: roomId, ownerId: ownerId }));
            window.location.href = 'chat.html?room=' + encodeURIComponent(roomId) + '&user=' + encodeURIComponent(ownerId) + '&source=index';
        };

        // ─── STRICT LOCATION ENFORCEMENT SEARCH ───
        window.runManualSearch = function() {
            var input = document.getElementById('search');
            var value = input ? input.value.trim() : '';
            var box = document.getElementById('searchSuggestions');
            
            if (!value) return resetToHome();

            // Enforce location selection if not explicitly clicked
            if (!selectedSearchPlace || selectedSearchPlace.displayName !== value) {
                if (box && box.__tingoItems && box.__tingoItems.length > 0) {
                    var topItem = box.__tingoItems[0];
                    input.value = topItem.displayName || `${topItem.label}, ${topItem.subLabel}`;
                    selectedSearchPlace = { lat: Number(topItem.lat), lon: Number(topItem.lon), label: topItem.label, displayName: input.value };
                    value = input.value;
                } else {
                    showAppPopup("Please select a valid location from the suggestions.", "Invalid Search");
                    if (box) box.classList.remove('show');
                    document.getElementById('searchBackdrop')?.classList.remove('show');
                    return;
                }
            }
            
            if (box) box.classList.remove('show');
            document.getElementById('searchBackdrop')?.classList.remove('show');
            
            document.body.classList.add('search-active');
            sessionStorage.setItem('tingo_ui_collapsed', 'true');
            sessionStorage.setItem('tingo_search_query', value);
            
            loadRooms(value, selectedSearchPlace);
        };

        // ─── NAV RESET LOGIC (EXPLORE BUTTON) ───
        window.resetToHome = function() {
            if (window.location.pathname.endsWith('index.html') || window.location.pathname === '/' || window.location.pathname.endsWith('/')) {
                document.body.classList.remove('search-active');
                
                var searchInput = document.getElementById('search');
                if (searchInput) searchInput.value = '';
                
                var clearBtn = document.getElementById('clearSearchBtn');
                if (clearBtn) clearBtn.classList.remove('show');
                
                var typeFilter = document.getElementById('filterType');
                if (typeFilter) typeFilter.value = '';
                
                var brokerageFilter = document.getElementById('filterBrokerage');
                if (brokerageFilter) brokerageFilter.value = '';
                
                selectedSearchPlace = null;
                
                sessionStorage.removeItem('tingo_ui_collapsed');
                sessionStorage.removeItem('tingo_search_query');
                sessionStorage.removeItem('tingo_search_place');
                
                updateFilterUI();
                loadRooms('', null);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                window.location.href = 'index.html';
            }
        };

        window.loadFilterOptions = async function() {
            var typeSelect = document.getElementById('filterType');
            var brokerageSelect = document.getElementById('filterBrokerage');
            if (!typeSelect) return;

            var selectedType = typeSelect.value || window.__TINGO_HOME_PREPAINT_STATE?.type || '';
            var selectedBrokerage = brokerageSelect?.value || window.__TINGO_HOME_PREPAINT_STATE?.brokerage || '';
            var defaultLabel = activePostMode === 'needed' ? 'Any type' : 'Any type';

            var requestedMode = activePostMode;
            var result;
            if (requestedMode === 'needed') {
                var r1 = await db.from('room_requirements').select('type,status').limit(1000);
                result = r1;
            } else {
                var r2 = await db.from('room_posts').select('type,brokerage_type,status').eq('status', 'active').limit(1000);
                if (r2.error) r2 = await db.from('room_posts').select('type,brokerage_type').limit(1000);
                result = r2;
            }

            if (result.error) {
                updateFilterUI();
                return;
            }

            var rows = (result.data || []).filter(function(row) {
                var status = String(row?.status || 'active').trim().toLowerCase();
                return !status || status === 'active' || (!status.includes('inactive') && !status.includes('disabled') && !status.includes('rejected'));
            });

            var typeValues = [...new Set(rows.map(function(row) { return cleanSearchTerm(row.type); }).filter(Boolean))].sort();
            var typeHtml = '<option value="">' + escapeHtml(defaultLabel) + '</option>' + typeValues.map(function(v) {
                return '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>';
            }).join('');
            typeSelect.innerHTML = typeHtml;
            if (selectedType && typeValues.includes(selectedType)) typeSelect.value = selectedType;

            if (brokerageSelect) {
                var brokerHtml = '<option value="">Any brokerage</option><option value="__brokerage_applicable__">Brokerage applicable</option><option value="__no_brokerage__">No brokerage</option>';
                brokerageSelect.innerHTML = brokerHtml;
                if (activePostMode === 'needed') {
                    brokerageSelect.value = '';
                    brokerageSelect.classList.add('hidden-for-mode');
                } else {
                    brokerageSelect.classList.remove('hidden-for-mode');
                    if (selectedBrokerage && (selectedBrokerage === '__brokerage_applicable__' || selectedBrokerage === '__no_brokerage__')) {
                        brokerageSelect.value = selectedBrokerage;
                    }
                }
            }
            updateFilterUI();
        };

        window.bindFilterEvents = function() {
            ['filterType', 'filterBrokerage'].forEach(function(id) {
                var el = document.getElementById(id);
                if (!el || el.dataset.stableFilterBound === '1') return;
                el.dataset.stableFilterBound = '1';
                el.addEventListener('change', function() {
                    selectedSearchPlace = null;
                    updateFilterUI();
                    
                    document.body.classList.add('search-active');
                    sessionStorage.setItem('tingo_ui_collapsed', 'true');
                    
                    loadRooms(getCurrentSearchText(), null);
                });
            });
            var clearBtn = document.getElementById('clearFilters');
            if (clearBtn && clearBtn.dataset.stableFilterBound !== '1') {
                clearBtn.dataset.stableFilterBound = '1';
                clearBtn.addEventListener('click', function() {
                    var type = document.getElementById('filterType');
                    var brokerage = document.getElementById('filterBrokerage');
                    if (type) type.value = '';
                    if (brokerage) brokerage.value = '';
                    selectedSearchPlace = null;
                    updateFilterUI();
                    
                    loadRooms(getCurrentSearchText(), null);
                });
            }
        };

        window.setPostMode = function(mode) {
            var nextMode = mode === 'needed' ? 'needed' : 'available';
            if (nextMode === activePostMode) return Promise.resolve();
            activePostMode = nextMode;
            tingoModeAwareLoadSeq += 1;
            tingoLoadRoomsSeq += 1;

            document.getElementById('modeAvailableBtn')?.classList.toggle('active', activePostMode === 'available');
            document.getElementById('modeNeededBtn')?.classList.toggle('active', activePostMode === 'needed');

            var typeFilter = document.getElementById('filterType');
            var brokerageFilter = document.getElementById('filterBrokerage');
            if (typeFilter) typeFilter.value = '';
            if (brokerageFilter) brokerageFilter.value = '';

            selectedSearchPlace = null;
            updateFilterUI();
            tingoClearFeedCaches();

            var roomList = document.getElementById('roomList');
            if (roomList) {
                roomList.removeAttribute('data-feed-signature');
                roomList.innerHTML = '';
            }
            tingoInitialFeedPainted = false;

            var feedPromise = Promise.resolve(loadRooms(getCurrentSearchText(), null));
            var filterPromise = Promise.resolve(loadFilterOptions());
            return Promise.allSettled([feedPromise, filterPromise]);
        };

        window.go = function(page) { window.location.href = page; };
        window.openChatList = function() { window.location.href = 'chat.html'; };
        
        var appPopupTimer = null;
        window.showAppPopup = function(message, title) {
            var popup = document.getElementById('appPopup');
            var msgEl = document.getElementById('appPopupMessage');
            if (!popup || !msgEl) return;
            msgEl.textContent = message;
            popup.classList.remove('hidden');
            clearTimeout(appPopupTimer);
            appPopupTimer = setTimeout(hideAppPopup, 4200);
        };
        window.hideAppPopup = function() {
            var popup = document.getElementById('appPopup');
            if (popup) popup.classList.add('hidden');
        };

        window.openNotifications = function() {
            document.getElementById('notificationPanel').classList.add('open');
            document.getElementById('notificationOverlay').classList.add('open');
        };
        window.closeNotifications = function() {
            document.getElementById('notificationPanel').classList.remove('open');
            document.getElementById('notificationOverlay').classList.remove('open');
        };

        window.initSmoothHomePage = function() {
            setupTingoAutocomplete(); 
            loadFilterOptions();
            bindFilterEvents();
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(pos) { 
                        window.userLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                        if (!document.body.classList.contains('search-active')) {
                            loadRooms(getCurrentSearchText(), selectedSearchPlace);
                        }
                    },
                    function(err) { console.warn("Geolocation blocked, using Pune center."); }
                );
            }

            var hasCache = tingoRenderCachedFeed(getCurrentSearchText(), selectedSearchPlace);
            if (!hasCache) tingoShowFeedSkeleton();
            
            loadRooms(getCurrentSearchText(), selectedSearchPlace);
        };

        document.addEventListener('DOMContentLoaded', function() {
            if (!window.__tingoHomeBooted) {
                window.__tingoHomeBooted = true;
                initSmoothHomePage();
            }
            
            const searchInputEl = document.getElementById('search');
            if (searchInputEl) {
                searchInputEl.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        runManualSearch();
                    }
                });
            }
        });
        
    </script>
</body>
</html>
