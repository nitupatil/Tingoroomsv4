<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Map - TingoRooms</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=block" rel="stylesheet">
<link rel="icon" href="https://i.ibb.co/N2ZhwrRn/Gemini-Generated-Image-h4mxnvh4mxnvh4mx-2.gif">

<style>
:root {
  --primary: #4F46E5;
  --primary-dark: #3730A3;
  --primary-gradient: linear-gradient(135deg, #7C3AED 0%, #4F46E5 55%, #06B6D4 100%);
  --primary-light: #EEF2FF;
  --primary-glow: rgba(79, 70, 229, 0.28);
  --accent: #F97316;
  --accent-soft: #FFF7ED;
  --success: #16A34A;
  --success-soft: #DCFCE7;
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --text-main: #0F172A;
  --text-muted: #64748B;
  --border: #E2E8F0;
  --radius: 22px;
  --safe-bottom: 78px;
  --nav-height: 76px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  color: var(--text-main);
  background:
    radial-gradient(circle at 10% 8%, rgba(124, 58, 237, 0.18), transparent 28%),
    radial-gradient(circle at 92% 18%, rgba(14, 165, 233, 0.16), transparent 25%),
    #E2E8F0;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.app-container {
  width: 100%;
  max-width: 430px;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, #F8FAFC 100%);
  box-shadow: 0 24px 70px rgba(15, 23, 42, 0.16);
}

/* ─── HEADER ─── */
.header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  background: rgba(248, 250, 252, 0.88);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border-bottom: 1px solid rgba(226, 232, 240, 0.76);
}

.logo {
  width: 42px;
  height: 42px;
  object-fit: cover;
  border-radius: 14px;
  box-shadow: 0 8px 20px rgba(79, 70, 229, 0.14);
  border: 2px solid rgba(255,255,255,0.8);
  flex: 0 0 auto;
}

.tingo-brand-title {
  flex: 0 0 auto;
  color: #2563EB;
  font-size: 15px;
  font-weight: 950;
  letter-spacing: -0.04em;
  line-height: 0.86;
  white-space: nowrap;
}

.tingo-brand-title span {
  display: block;
  margin-top: 1px;
  color: #0F766E;
  font-size: 7.5px;
  line-height: 1;
  letter-spacing: 0.08em;
  font-weight: 850;
}

.search-box { flex: 1; min-width: 0; position: relative; }
.search-box input {
  width: 100%;
  height: 42px;
  padding: 0 46px 0 40px;
  border-radius: 999px;
  border: 1px solid rgba(226, 232, 240, 0.95);
  background: rgba(255, 255, 255, 0.9);
  color: var(--text-main);
  font-size: 13px;
  font-weight: 600;
  outline: none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.75), 0 8px 18px rgba(15, 23, 42, 0.04);
}
.search-box input:focus {
  border-color: rgba(79, 70, 229, 0.42);
  background: #FFFFFF;
  box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08), 0 10px 20px rgba(79, 70, 229, 0.08);
}
.search-box .search-leading {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: #94A3B8;
  font-size: 20px;
  pointer-events: none;
  transition: color 0.22s ease;
}
.search-box:focus-within .search-leading {
  color: var(--primary);
}

.search-action-btn {
  position: absolute;
  right: 5px;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: 50%;
  color: #FFFFFF;
  background: var(--primary-gradient);
  box-shadow: 0 8px 16px var(--primary-glow);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.search-action-btn .material-symbols-rounded {
  font-size: 18px;
}
.search-action-btn:active { transform: translateY(-50%) scale(0.92); }

/* ─── ENHANCED SEARCH SUGGESTIONS (Pune District) ─── */
.search-suggestions {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  z-index: 1200;
  display: none;
  max-height: min(400px, 65vh);
  overflow-y: auto;
  padding: 6px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(226, 232, 240, 0.95);
  box-shadow: 0 18px 38px rgba(15, 23, 42, 0.17);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.search-suggestions.show { display: block; }

.suggestion-section-title {
  padding: 7px 10px 5px;
  color: #94A3B8;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.suggestion-item {
  width: 100%;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px;
  border-radius: 14px;
  cursor: pointer;
  transition: background 0.18s ease, transform 0.18s ease;
}
.suggestion-item:hover,
.suggestion-item:active { background: var(--primary-light); }
.suggestion-item .material-symbols-rounded {
  position: static;
  transform: none;
  color: var(--primary);
  font-size: 20px;
  flex: 0 0 auto;
  margin-top: 1px;
}
.suggestion-main {
  color: var(--text-main);
  font-size: 13px;
  font-weight: 900;
  line-height: 1.25;
}
.suggestion-sub {
  margin-top: 3px;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.3;
}
.suggestion-empty {
  padding: 12px;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 800;
  line-height: 1.35;
}

/* ─── MAP ─── */
.map-status {
  position: absolute;
  top: 122px;
  left: 12px;
  right: 12px;
  z-index: 680;
  display: none;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 18px;
  background: rgba(238, 242, 255, 0.96);
  color: #3730A3;
  border: 1px solid rgba(165, 180, 252, 0.60);
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  font-size: 12px;
  font-weight: 800;
  line-height: 1.35;
}
.map-status.show { display: flex; }
.map-status .material-symbols-rounded {
  font-size: 18px;
  flex: 0 0 auto;
}

.app-toast {
  position: absolute;
  left: 14px;
  right: 14px;
  top: 124px;
  z-index: 1300;
  display: none;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  border-radius: 18px;
  color: #0F172A;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(226, 232, 240, 0.95);
  box-shadow: 0 20px 44px rgba(15, 23, 42, 0.18);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  font-size: 12px;
  font-weight: 800;
  line-height: 1.4;
}
.app-toast.show { display: flex; }
.app-toast .material-symbols-rounded {
  color: var(--primary);
  font-size: 20px;
  flex: 0 0 auto;
}
.toast-close {
  margin-left: auto;
  border: 0;
  background: transparent;
  color: #94A3B8;
  cursor: pointer;
  display: flex;
  align-items: center;
}
.toast-close .material-symbols-rounded { color: #94A3B8; font-size: 18px; }

.icon-btn {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  color: var(--primary-dark);
  background: #FFFFFF;
  border: 1px solid rgba(226, 232, 240, 0.95);
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.05);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
}
.icon-btn:active { transform: scale(0.94); background: var(--primary-light); }

.map-tabs {
  position: absolute;
  top: 74px;
  left: 12px;
  right: 12px;
  z-index: 690;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding: 5px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(226, 232, 240, 0.95);
  box-shadow: 0 10px 22px rgba(15, 23, 42, 0.08);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.map-tab {
  min-height: 34px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 900;
  cursor: pointer;
  white-space: nowrap;
}
.map-tab.active {
  color: #FFFFFF;
  background: var(--primary-gradient);
  box-shadow: 0 8px 16px var(--primary-glow);
}

#map {
  width: 100%;
  height: 100%;
  background: #E2E8F0;
  z-index: 1;
}

.leaflet-control-attribution { display: none; }
.leaflet-popup-content-wrapper {
  border-radius: 18px;
  box-shadow: 0 16px 32px rgba(15, 23, 42, 0.18);
}
.leaflet-popup-content { margin: 12px; font-family: 'Inter', sans-serif; min-width: 210px; }
.popup-title { font-size: 14px; font-weight: 900; margin-bottom: 4px; }
.popup-sub { font-size: 12px; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; line-height: 1.35; }
.popup-btn {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 9px 10px;
  color: #FFFFFF;
  background: var(--primary-gradient);
  font-size: 12px;
  font-weight: 900;
  cursor: pointer;
}

/* ─── WAVE ANIMATION FOR MARKERS ─── */
.marker-container {
  position: relative;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.marker-dot {
  width: 34px;
  height: 34px;
  border-radius: 50% 50% 50% 12px;
  transform: rotate(-45deg);
  background: var(--primary-gradient);
  border: 3px solid #FFFFFF;
  box-shadow: 0 8px 18px rgba(79, 70, 229, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 2;
}
.marker-dot span {
  transform: rotate(45deg);
  color: white;
  font-size: 18px;
}
.marker-dot.needed {
  background: linear-gradient(135deg, #F97316, #22C55E);
  box-shadow: 0 8px 18px rgba(249, 115, 22, 0.32);
}
.marker-wave {
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 2px solid rgba(79, 70, 229, 0.4);
  animation: wavePulse 2s ease-out infinite;
  pointer-events: none;
  z-index: 1;
}
.marker-wave.needed {
  border-color: rgba(249, 115, 22, 0.4);
}
.marker-wave:nth-child(2) {
  animation-delay: 0.6s;
}
.marker-wave:nth-child(3) {
  animation-delay: 1.2s;
}
@keyframes wavePulse {
  0% {
    transform: scale(0.8);
    opacity: 0.8;
  }
  100% {
    transform: scale(1.6);
    opacity: 0;
  }
}

/* User location marker */
.tingo-user-wrap {
  position: relative;
  width: 58px;
  height: 68px;
  transform: translateY(-10px);
}
.tingo-user-avatar {
  width: 58px;
  height: 58px;
  margin: 0 auto;
  object-fit: contain;
  background: transparent;
  border: none;
  box-shadow: none;
  display: block;
}
.tingo-user-label {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  padding: 3px 8px;
  border-radius: 999px;
  color: #FFFFFF;
  background: linear-gradient(135deg, #0EA5E9, #4F46E5);
  border: 2px solid #FFFFFF;
  box-shadow: 0 8px 18px rgba(15, 23, 42, .20);
  font-size: 10px;
  font-weight: 900;
  white-space: nowrap;
}
.tingo-search-marker {
  width: 38px;
  height: 38px;
  border-radius: 50% 50% 50% 12px;
  transform: rotate(-45deg);
  background: linear-gradient(135deg, #EF4444, #F97316);
  border: 3px solid #FFFFFF;
  box-shadow: 0 10px 24px rgba(239, 68, 68, .34);
  display: flex;
  align-items: center;
  justify-content: center;
}
.tingo-search-marker span {
  transform: rotate(45deg);
  color: #FFFFFF;
  font-size: 20px;
}

/* ─── EMBEDDED BOTTOM NAV ─── */
.bottom-nav-embedded {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  z-index: 999999;
  width: 100%;
  max-width: 430px;
  display: flex;
  align-items: flex-end;
  justify-content: space-around;
  gap: 2px;
  padding: 10px 10px max(16px, env(safe-area-inset-bottom));
  border-top: 1px solid rgba(226, 232, 240, 0.82);
  border-radius: 24px 24px 0 0;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 -14px 34px rgba(15, 23, 42, 0.08);
  height: var(--nav-height);
}

.nav-item {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: #94A3B8;
  font-size: 10.5px;
  font-weight: 800;
  cursor: pointer;
  position: relative;
  transition: color 0.22s ease, transform 0.18s ease;
  -webkit-tap-highlight-color: transparent;
  text-decoration: none;
  background: transparent;
  border: 0;
  padding: 0;
}
.nav-item:active { transform: scale(0.94); }
.nav-item.active { color: var(--primary); }
.nav-item .icon-wrapper {
  position: relative;
  min-width: 46px;
  height: 32px;
  padding: 3px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  transition: background 0.22s ease;
}
.nav-item.active .icon-wrapper { background: var(--primary-light); }
.nav-item .material-symbols-rounded { font-size: 28px; }
.nav-item.post-btn { margin-top: -18px; }
.nav-item.post-btn .material-symbols-rounded {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 58px;
  height: 58px;
  margin-bottom: 0;
  border-radius: 20px;
  color: #FFFFFF;
  background: var(--primary-gradient);
  border: 5px solid #FFFFFF;
  box-shadow: 0 14px 24px var(--primary-glow);
  font-size: 34px;
}
.nav-item.post-btn span:last-child { margin-top: 1px; color: var(--primary); }

#msgBadge {
  position: absolute;
  top: -5px;
  right: -6px;
  min-width: 18px;
  height: 18px;
  padding: 0 4px;
  border-radius: 999px;
  background: #EF4444;
  color: #FFFFFF;
  border: 2px solid #FFFFFF;
  box-shadow: 0 4px 10px rgba(239, 68, 68, 0.32);
  font-size: 10px;
  line-height: 14px;
  text-align: center;
  font-weight: 900;
}

/* ─── DESKTOP ─── */
@media (min-width: 900px) {
  :root {
    --nav-height: 0px;
    --safe-bottom: 24px;
  }

  body {
    display: block;
    padding: 0;
    background: #E2E8F0;
  }

  .app-container {
    max-width: none;
    width: 100%;
    height: 100vh;
    margin: 0;
    border-radius: 0;
    border: 0;
    box-shadow: none;
    padding-right: 148px; /* room for side nav */
  }

  .header {
    padding: 16px 24px;
    position: absolute;
    top: 0;
    left: 0;
    right: 148px;
    border-radius: 0;
  }

  .map-tabs {
    top: 82px;
    left: 24px;
    right: calc(148px + 24px);
  }

  .map-status,
  .app-toast {
    left: 24px;
    right: calc(148px + 24px);
    top: 128px;
    max-width: none;
  }

  #map {
    width: 100%;
    height: 100%;
  }

  .bottom-nav-embedded {
    position: fixed;
    top: 120px;
    right: 24px;
    bottom: 24px;
    left: auto;
    width: 96px;
    max-width: 96px;
    height: calc(100vh - 144px);
    min-height: 360px;
    transform: none;
    border-radius: 30px;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    gap: 10px;
    padding: 16px 8px;
    border: 1px solid rgba(226, 232, 240, 0.7);
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }

  .nav-item {
    width: 100%;
    flex: 0 0 auto;
    justify-content: center;
    padding: 10px 0;
    flex-direction: column;
    gap: 3px;
  }
  .nav-item .icon-wrapper {
    padding: 10px;
    height: auto;
    min-width: auto;
  }
  .nav-item.post-btn {
    width: 100%;
    margin-top: 6px;
  }
  .nav-item .material-symbols-rounded { font-size: 24px; }
  .nav-item span {
    margin-top: 6px;
    font-size: 10px;
    white-space: nowrap;
    text-align: center;
  }
  .nav-item.post-btn .material-symbols-rounded {
    width: auto;
    height: auto;
    margin-top: 0;
    font-size: 22px;
    border-radius: 50%;
    padding: 12px;
    border: 0;
  }
}

@media (min-width: 900px) and (max-height: 700px) {
  .bottom-nav-embedded {
    padding: 12px 6px;
    gap: 4px;
    min-height: 300px;
    height: calc(100vh - 100px);
  }
  .nav-item { padding: 6px 0; }
  .nav-item .material-symbols-rounded { font-size: 20px; }
  .nav-item span { font-size: 9px; margin-top: 3px; }
  .nav-item.post-btn .material-symbols-rounded { padding: 8px; font-size: 18px; }
}

/* ─── MOBILE ─── */
@media (max-width: 899px) {
  :root {
    --safe-bottom: 78px;
    --nav-height: 76px;
  }

  .app-container {
    max-width: 430px;
    padding-bottom: calc(var(--nav-height) + 4px);
    height: 100dvh;
  }

  .header {
    padding: 8px 12px;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
  }

  .logo { width: 32px; height: 32px; }
  .tingo-brand-title {
    font-size: 13px;
    min-width: 43px;
  }
  .tingo-brand-title span { font-size: 7px; }

  .search-box input {
    height: 36px;
    font-size: 12px !important;
    padding: 0 38px 0 34px;
  }
  .search-box .search-leading { left: 10px; font-size: 17px; }
  .search-action-btn { width: 28px; height: 28px; }
  .search-action-btn .material-symbols-rounded { font-size: 16px; }

  .icon-btn { width: 36px; height: 36px; }
  .icon-btn .material-symbols-rounded { font-size: 20px; }

  .map-tabs {
    top: 72px;
    left: 10px;
    right: 10px;
  }
  .map-tab { font-size: 10px; min-height: 30px; }

  .map-status, .app-toast {
    top: 118px;
    left: 10px;
    right: 10px;
  }

  #map { height: 100%; }

  .bottom-nav-embedded {
    max-width: 430px;
    border-radius: 24px 24px 0 0;
    height: var(--nav-height);
  }

  .search-suggestions {
    max-height: min(360px, 55vh);
  }
}

@media (max-width: 374px) {
  .bottom-nav-embedded {
    padding: 8px 8px max(12px, env(safe-area-inset-bottom));
    height: calc(var(--nav-height) - 4px);
  }
  .nav-item.post-btn .material-symbols-rounded {
    width: 50px;
    height: 50px;
    font-size: 28px;
    border-width: 4px;
  }
  .nav-item span:last-child { font-size: 9.5px; }
  .tingo-brand-title { display: none; }
  .map-tab { font-size: 9px; }
}

/* ─── SMOOTH NAV / MAP PERFORMANCE ─── */
.map-tab, .map-card, .bottom-nav-embedded, .header, .map-status, .app-toast {
  will-change: transform, opacity;
}
#map {
  transform: translateZ(0);
  contain: layout paint;
}
.leaflet-marker-icon, .leaflet-marker-shadow, .leaflet-pane, .leaflet-map-pane {
  will-change: transform;
}
</style>

</head>

<div class="app-container">

//  UTILITY FUNCTIONS (copied from index.html)
// ════════════════════════════════════════════════════════════════

function safeJson(value, fallback = null) {
  try { return JSON.parse(value || "null") || fallback; }
  catch (e) { return fallback; }
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function isValidCoord(lat, lng) {
  const a = Number(lat);
  const b = Number(lng);
  return Number.isFinite(a) && Number.isFinite(b) && Math.abs(a) <= 90 && Math.abs(b) <= 180 && !(a === 0 && b === 0);
}

function normalizeSearchTarget(target) {
  if (!target) return null;
  const lat = Number(target.lat);
  const lng = Number(target.lng ?? target.lon);
  if (!isValidCoord(lat, lng)) return null;
  return {
    ...target,
    lat,
    lng,
    lon: Number.isFinite(Number(target.lon)) ? Number(target.lon) : lng
  };
}

function cleanSearchTerm(value) {
  return String(value || "")
    .replace(/[,%()]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function normalizeSearchKey(value) {
  return cleanSearchTerm(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function tingoCleanLocationText(value) {
  return String(value || "")
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function tingoNormalizeLocationQuery(value) {
  let text = tingoCleanLocationText(value);
  const replacements = [
    [/\bclg\b|\bcollage\b|\bcolg\b/g, "college"],
    [/\bchok\b|\bchouk\b|\bchowk\b/g, "chowk"],
    [/\bgali\b|\bgully\b|\blane\b/g, "galli"],
    [/\bbldg\b|\bbld\b/g, "building"],
    [/\bsoc\b|\bscty\b/g, "society"],
    [/\bapt\b|\baprt\b|\bapartment\b/g, "apartment"],
    [/\brd\b/g, "road"],
    [/\bnr\b/g, "near"],
    [/\bfata\b|\bphata\b/g, "phata"],
    [/\bpunee\b|\bpoona\b/g, "pune"],
    [/\bhavdhan\b|\bbavadhan\b|\bbavdan\b/g, "bavdhan"],
    [/\bbhukhum\b|\bbhukam\b/g, "bhukum"],
    [/\bkotharud\b/g, "kothrud"],
    [/\bhinjawadi\b/g, "hinjewadi"]
  ];
  replacements.forEach(([pattern, replacement]) => { text = text.replace(pattern, replacement); });
  return text.replace(/\s+/g, " ").trim();
}

function tingoLevenshtein(a, b) {
  a = tingoCleanLocationText(a);
  b = tingoCleanLocationText(b);
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  const row = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let previous = i - 1;
    row[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const old = row[j];
      row[j] = Math.min(
        row[j] + 1,
        row[j - 1] + 1,
        previous + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
      previous = old;
    }
  }
  return row[b.length];
}

function tingoTextScore(term, haystack) {
  const q = tingoNormalizeLocationQuery(term);
  const h = tingoNormalizeLocationQuery(haystack);
  if (!q || !h) return 0;
  if (h === q) return 100;
  if (h.startsWith(q)) return 92;
  if (h.includes(q)) return 82;
  const words = q.split(" ").filter(Boolean);
  let score = 0;
  words.forEach(word => {
    if (h.includes(word)) score += 18;
    else if (word.length >= 4) {
      const closest = h.split(" ").some(hw => Math.abs(hw.length - word.length) <= 2 && tingoLevenshtein(hw, word) <= 2);
      if (closest) score += 10;
    }
  });
  return Math.min(score, 75);
}

function tingoIsInsidePuneDistrict(lt, ln) {
  const latNum = Number(lt);
  const lonNum = Number(ln);
  return Number.isFinite(latNum) && Number.isFinite(lonNum) &&
    lonNum >= TINGO_PUNE_BOUNDS.west && lonNum <= TINGO_PUNE_BOUNDS.east &&
    latNum >= TINGO_PUNE_BOUNDS.south && latNum <= TINGO_PUNE_BOUNDS.north;
}

function tingoIconForLocation(text) {
  const t = tingoCleanLocationText(text);
  if (/college|university|institute|school|academy|clg/.test(t)) return "school";
  if (/hospital|clinic|medical|doctor|health/.test(t)) return "local_hospital";
  if (/mall|market|store|shop|complex/.test(t)) return "storefront";
  if (/station|railway|metro|bus|depot|airport/.test(t)) return "directions_transit";
  if (/road|street|lane|galli|gully|chowk|phata|naka|circle|bridge/.test(t)) return "alt_route";
  if (/society|apartment|building|tower|residency|heights|villa|park|city|colony|nagar/.test(t)) return "apartment";
  return "location_on";
}

function tingoDeduplicateSuggestions(items) {
  const seen = new Set();
  const final = [];
  (items || []).forEach(item => {
    const latVal = Number(item.lat);
    const lonVal = Number(item.lon);
    if (!item || !item.label || !Number.isFinite(latVal) || !Number.isFinite(lonVal)) return;
    if (!tingoIsInsidePuneDistrict(latVal, lonVal)) return;
    const key = `${tingoCleanLocationText(item.label)}_${latVal.toFixed(4)}_${lonVal.toFixed(4)}`;
    if (seen.has(key)) return;
    seen.add(key);
    final.push({
      source: item.source || "map",
      label: item.label,
      subLabel: item.subLabel || "Pune District, Maharashtra",
      displayName: item.displayName || `${item.label}, ${item.subLabel || "Pune District, Maharashtra"}`,
      lat: latVal,
      lon: lonVal,
      icon: item.icon || tingoIconForLocation(`${item.label} ${item.subLabel || ""}`),
      score: item.score || 0
    });
  });
  return final;
}

function tingoLocalSuggestions(term, limit = 8) {
  const query = tingoNormalizeLocationQuery(term);
  if (!query) return [];
  return tingoDeduplicateSuggestions(TINGO_LOCAL_PUNE_PLACES.map(place => {
    const haystack = `${place.label} ${place.subLabel} ${place.aliases || ""}`;
    const score = tingoTextScore(query, haystack);
    return {
      source: "local",
      label: place.label,
      subLabel: place.subLabel,
      displayName: `${place.label}, ${place.subLabel}`,
      lat: place.lat,
      lon: place.lon,
      icon: tingoIconForLocation(haystack),
      score
    };
  }).filter(item => item.score > 0)).sort((a, b) => b.score - a.score).slice(0, limit);
}

function tingoCacheKey(term) {
  return "tingo_pune_location_v4_" + tingoNormalizeLocationQuery(term).slice(0, 70);
}

function tingoReadLocationCache(term) {
  try {
    const key = tingoCacheKey(term);
    const raw = sessionStorage.getItem(key) || localStorage.getItem(key);
    if (!raw) return [];
    const payload = JSON.parse(raw);
    if (!payload || !Array.isArray(payload.items)) return [];
    if (Date.now() - Number(payload.time || 0) > 1000 * 60 * 60 * 24 * 14) return [];
    return payload.items;
  } catch (e) {
    return [];
  }
}

function tingoWriteLocationCache(term, items) {
  try {
    const payload = JSON.stringify({ time: Date.now(), items: (items || []).slice(0, 12) });
    sessionStorage.setItem(tingoCacheKey(term), payload);
    localStorage.setItem(tingoCacheKey(term), payload);
  } catch (e) {}
}

function tingoBuildNominatimSuggestion(place) {
  const address = place.address || {};
  const named = place.namedetails || {};
  const firstDisplay = String(place.display_name || "").split(",")[0];
  const label = named.name || place.name || address.building || address.house_name || address.amenity || address.shop || address.office || address.tourism || address.leisure || address.road || address.neighbourhood || firstDisplay;
  const roadLine = [address.house_number, address.road].filter(Boolean).join(" ");
  const areaLine = [address.neighbourhood || address.suburb || address.quarter || address.city_district || address.village || address.town || address.city || "Pune", address.county || address.state].filter(Boolean).join(", ");
  const subLabel = [roadLine, areaLine].filter(Boolean).join(" · ") || "Pune District, Maharashtra";
  return {
    source: "map",
    label: label || firstDisplay || "Location",
    subLabel,
    displayName: place.display_name || `${label}, ${subLabel}`,
    lat: Number(place.lat),
    lon: Number(place.lon),
    icon: tingoIconForLocation(`${label} ${subLabel} ${place.type || ""} ${place.class || ""}`),
    score: Number(place.importance || 0) * 10
  };
}

function tingoBuildPhotonSuggestion(feature) {
  const props = feature.properties || {};
  const coords = feature.geometry && feature.geometry.coordinates ? feature.geometry.coordinates : [];
  const labelParts = [props.name, props.housenumber && props.street ? `${props.housenumber} ${props.street}` : null, props.street].filter(Boolean);
  const label = labelParts[0] || "Location";
  const subLabel = [props.district || props.locality || props.city || props.county || "Pune", props.state || "Maharashtra"].filter(Boolean).join(", ");
  return {
    source: "map",
    label,
    subLabel,
    displayName: [props.name, props.street, props.locality || props.city || props.county, props.state].filter(Boolean).join(", "),
    lat: Number(coords[1]),
    lon: Number(coords[0]),
    icon: tingoIconForLocation(`${props.name || ""} ${props.street || ""} ${props.osm_value || ""}`),
    score: 20
  };
}

async function tingoFetchJson(url, signal) {
  const options = { headers: { "Accept": "application/json" } };
  if (signal) options.signal = signal;
  const response = await fetch(url, options);
  if (!response.ok) throw new Error(`Location search failed ${response.status}`);
  return response.json();
}

async function tingoFetchPhoton(term, signal) {
  const normalized = tingoNormalizeLocationQuery(term);
  const variants = [...new Set([term, normalized, `${normalized} Pune`, `${normalized} Pune Maharashtra`].filter(Boolean))].slice(0, 3);
  const urls = variants.map(q => `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=${PUNE_CENTER.lat}&lon=${PUNE_CENTER.lng}&limit=12&lang=en`);
  const results = await Promise.allSettled(urls.map(url => tingoFetchJson(url, signal)));
  const items = [];
  results.forEach(result => {
    if (result.status !== "fulfilled") return;
    (result.value.features || []).forEach(feature => items.push(tingoBuildPhotonSuggestion(feature)));
  });
  return items;
}

async function tingoFetchNominatim(term, signal) {
  const normalized = tingoNormalizeLocationQuery(term);
  const variants = [...new Set([term, normalized, `${normalized} Pune District Maharashtra India`, `${normalized} Pune Maharashtra India`].filter(Boolean))].slice(0, 3);
  const common = `format=json&addressdetails=1&namedetails=1&extratags=1&limit=12&countrycodes=in&viewbox=${encodeURIComponent(TINGO_PUNE_VIEWBOX)}&bounded=1`;
  const urls = variants.map(q => `https://nominatim.openstreetmap.org/search?${common}&q=${encodeURIComponent(q)}`);
  const results = await Promise.allSettled(urls.map(url => tingoFetchJson(url, signal)));
  const items = [];
  results.forEach(result => {
    if (result.status !== "fulfilled") return;
    (result.value || []).forEach(place => items.push(tingoBuildNominatimSuggestion(place)));
  });
  return items;
}

async function tingoLiveSuggestions(term, signal) {
  const cached = tingoReadLocationCache(term);
  if (cached.length) return cached;

  const [photon, nominatim] = await Promise.allSettled([
    tingoFetchPhoton(term, signal),
    tingoFetchNominatim(term, signal)
  ]);

  const merged = [
    ...(photon.status === "fulfilled" ? photon.value : []),
    ...(nominatim.status === "fulfilled" ? nominatim.value : [])
  ];

  const query = tingoNormalizeLocationQuery(term);
  const final = tingoDeduplicateSuggestions(merged).map(item => {
    item.score = (item.score || 0) + tingoTextScore(query, `${item.label} ${item.subLabel} ${item.displayName}`);
    return item;
  }).filter(item => item.score > 8 || tingoTextScore(query, item.displayName) > 8)
    .sort((a, b) => b.score - a.score)
    .slice(0, 14);

  if (final.length) tingoWriteLocationCache(term, final);
  return final;
}

function tingoRenderSuggestions(box, items, message = "") {
  if (!box) return;
  const unique = tingoDeduplicateSuggestions(items).slice(0, 12);
  const rows = unique.map((item, index) => `
    <div class="suggestion-item" data-index="${index}">
      <span class="material-symbols-rounded">${escapeHtml(item.icon || "location_on")}</span>
      <div>
        <div class="suggestion-main">${escapeHtml(item.label)}</div>
        <div class="suggestion-sub">${escapeHtml(item.subLabel)}</div>
      </div>
    </div>
  `).join("");

  box.innerHTML = rows + (message ? `<div class="suggestion-empty">${escapeHtml(message)}</div>` : "");
  if (rows || message) box.classList.add("show");
  else box.classList.remove("show");
  box.__tingoItems = unique;
}

function tingoAttachClickHandler(input, box) {
  if (!box || box.__tingoClickBound) return;
  box.__tingoClickBound = true;
  box.addEventListener("click", (event) => {
    const row = event.target.closest(".suggestion-item");
    if (!row) return;
    const item = (box.__tingoItems || [])[Number(row.dataset.index)];
    if (!item) return;
    input.value = item.displayName || `${item.label}, ${item.subLabel}`;
    selectedMapPlace = normalizeSearchTarget({
      lat: Number(item.lat),
      lng: Number(item.lon),
      lon: Number(item.lon),
      label: item.label,
      displayName: input.value,
      subLabel: item.subLabel
    });

    if (map && selectedMapPlace) {
      map.setView([selectedMapPlace.lat, selectedMapPlace.lng], 16, { animate: true });
      drawSearchArea(selectedMapPlace, input.value);
    }

    box.classList.remove("show");
    renderMap({ focusSearch: true, zoomToTarget: true });
  });
}

// ─── SETUP AUTOCOMPLETE ───
function setupTingoAutocomplete() {
  const input = document.getElementById("mapSearch");
  const box = document.getElementById("mapSearchSuggestions");
  if (!input || !box) return;

  let timer = null;
  let requestId = 0;

  tingoAttachClickHandler(input, box);

  input.addEventListener("input", () => {
    const term = input.value.trim();
    requestId += 1;
    const thisRequest = requestId;
    clearTimeout(timer);

    if (term.length < 2) {
      box.classList.remove("show");
      box.innerHTML = "";
      box.__tingoItems = [];
      return;
    }

    const local = tingoLocalSuggestions(term, 8);
    const cached = tingoReadLocationCache(term);
    const instant = tingoDeduplicateSuggestions([...local, ...cached]);
    tingoRenderSuggestions(box, instant, instant.length ? "Searching Pune district locations..." : "Searching Pune district locations...");

    timer = setTimeout(async () => {
      try {
        const live = await tingoLiveSuggestions(term);
        if (thisRequest !== requestId) return;
        const merged = tingoDeduplicateSuggestions([...local, ...live]);
        if (merged.length) {
          tingoRenderSuggestions(box, merged, "");
        } else {
          tingoRenderSuggestions(box, [], "No exact place found yet. Try society/building + area, for example 'ABC Society Bavdhan'.");
        }
      } catch (error) {
        if (error && error.name === "AbortError") return;
        if (thisRequest !== requestId) return;
        const fallback = tingoDeduplicateSuggestions([...local, ...cached]);
        tingoRenderSuggestions(box, fallback, fallback.length ? "Showing saved suggestions. Keep typing for exact place." : "Live location search is slow. Check spelling or add Pune area name.");
        console.warn("Tingo location search error", error);
      }
    }, 160);
  });

  document.addEventListener("click", (e) => {
    if (input && box && !input.contains(e.target) && !box.contains(e.target)) {
      box.classList.remove("show");
    }
  });
}

// ════════════════════════════════════════════════════════════════
//  MAP FUNCTIONS (original map logic with wave markers)
// ════════════════════════════════════════════════════════════════

function getStoredUser() {
  return safeJson(localStorage.getItem("user"));
}

function getDeviceName() {
  const ua = navigator.userAgent || "";
  let browser = "Browser";
  if (/Edg\//.test(ua)) browser = "Edge";
  else if (/Chrome\//.test(ua)) browser = "Chrome";
  else if (/Firefox\//.test(ua)) browser = "Firefox";
  else if (/Safari\//.test(ua)) browser = "Safari";

  let device = "Desktop";
  if (/Android/i.test(ua)) device = "Android";
  else if (/iPhone/i.test(ua)) device = "iPhone";
  else if (/iPad/i.test(ua)) device = "iPad";
  else if (/Windows/i.test(ua)) device = "Windows";
  else if (/Macintosh|Mac OS/i.test(ua)) device = "Mac";

  return `${browser} on ${device}`;
}

function getLocationCacheKey() {
  const user = getStoredUser();
  return `tingo_logged_device_location_${user && user.id ? user.id : "guest"}`;
}

function saveLoggedDeviceLocation(lat, lng, accuracy) {
  if (!isValidCoord(lat, lng)) return;
  const user = getStoredUser();
  const payload = {
    lat: Number(lat),
    lng: Number(lng),
    accuracy: Number(accuracy || 0),
    user_id: user && user.id ? user.id : null,
    device_name: user && user.active_device_name ? user.active_device_name : getDeviceName(),
    updated_at: new Date().toISOString()
  };
  try { localStorage.setItem(getLocationCacheKey(), JSON.stringify(payload)); } catch (e) {}
}

function getCachedLoggedDeviceLocation() {
  const cached = safeJson(localStorage.getItem(getLocationCacheKey()));
  if (!cached || !isValidCoord(cached.lat, cached.lng)) return null;
  return cached;
}

function setLoggedDeviceMarker(lat, lng, options = {}) {
  if (!map || !isValidCoord(lat, lng)) return;

  userLocation = {
    lat: Number(lat),
    lng: Number(lng),
    accuracy: Number(options.accuracy || 0)
  };

  const user = getStoredUser();
  const deviceName = (user && user.active_device_name) || options.deviceName || getDeviceName();
  const accuracyText = userLocation.accuracy ? `<br><span style="color:#64748B;font-size:11px;font-weight:700;">Accuracy: about ${Math.round(userLocation.accuracy)} m</span>` : "";
  const sourceText = options.fromCache ? "Last saved device location" : "Current logged-in device location";

  if (userMarker) map.removeLayer(userMarker);
  userMarker = L.marker([userLocation.lat, userLocation.lng], { icon: makeUserIcon(), zIndexOffset: 1000 })
    .addTo(map)
    .bindPopup(`<b>${sourceText}</b><br><span style="color:#64748B;font-size:11px;font-weight:700;">${escapeHtml(deviceName)}</span>${accuracyText}`);

  if (options.openPopup !== false) userMarker.openPopup();
  keepUserLocationVisible();

  if (allPosts.length) {
    clearTimeout(window.__tingoUserDistanceRenderTimer);
    window.__tingoUserDistanceRenderTimer = setTimeout(() => renderMap({ fromLocationUpdate: true }), 80);
  } else if (options.pan !== false) {
    map.setView([userLocation.lat, userLocation.lng], options.zoom || 15, { animate: true });
  }
}

function loadCachedLoggedDeviceLocation() {
  const cached = getCachedLoggedDeviceLocation();
  if (!cached) return false;
  setLoggedDeviceMarker(cached.lat, cached.lng, {
    accuracy: cached.accuracy,
    deviceName: cached.device_name,
    fromCache: true,
    pan: true,
    openPopup: false,
    zoom: 15
  });
  return true;
}

function requestLoggedDeviceLocation(options = {}) {
  const silent = options.silent === true;
  if (!navigator.geolocation) {
    if (!silent) showMapNotice("Location is not supported by this browser.");
    return;
  }
  navigator.geolocation.getCurrentPosition(pos => {
    const deviceLat = pos.coords.latitude;
    const deviceLng = pos.coords.longitude;
    const accuracy = pos.coords.accuracy;
    saveLoggedDeviceLocation(deviceLat, deviceLng, accuracy);
    setLoggedDeviceMarker(deviceLat, deviceLng, {
      accuracy,
      fromCache: false,
      pan: options.pan !== false,
      openPopup: options.openPopup !== false,
      zoom: options.zoom || 15
    });
  }, () => {
    if (!silent) showMapNotice("Unable to get this device location. Please allow location permission and turn on GPS/location services.");
  }, {
    enableHighAccuracy: true,
    timeout: 18000,
    maximumAge: 0
  });
}

function distanceKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const toRad = deg => deg * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
    Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function getPostCoords(post) {
  if (!post) return null;
  const lat = Number(post.latitude || post.lat);
  const lng = Number(post.longitude || post.lng || post.lon);
  return isValidCoord(lat, lng) ? { lat, lng } : null;
}

function getImage(post) {
  if (!post || !post.images) return "";
  return String(post.images).split(",").map(x => x.trim()).filter(Boolean)[0] || "";
}

function postUrl(post) {
  if (post.kind === "needed") return `roomdetails.html?id=${encodeURIComponent(post.id)}&type=needed&source=requirement`;
  return `roomdetails.html?id=${encodeURIComponent(post.id)}&type=available`;
}

function showMapNotice(message, icon = "info") {
  const toast = document.getElementById("appToast");
  const text = document.getElementById("appToastText");
  if (!toast || !text) return;
  toast.querySelector(".material-symbols-rounded").textContent = icon;
  text.textContent = message;
  toast.classList.add("show");
  clearTimeout(window.__tingoMapToastTimer);
  window.__tingoMapToastTimer = setTimeout(hideMapNotice, 4200);
}

function hideMapNotice() {
  const toast = document.getElementById("appToast");
  if (toast) toast.classList.remove("show");
}

function showMapStatus(message) {
  const status = document.getElementById("mapStatus");
  const text = document.getElementById("mapStatusText");
  if (!status || !text) return;
  if (!message) {
    status.classList.remove("show");
    text.textContent = "";
    return;
  }
  text.textContent = message;
  status.classList.add("show");
}

function hideMapStatus() {
  showMapStatus("");
}

function showSuggestionBox(html) {
  const box = document.getElementById("mapSearchSuggestions");
  if (!box) return;
  box.innerHTML = html;
  box.classList.add("show");
}

function hideSuggestionBox() {
  const box = document.getElementById("mapSearchSuggestions");
  if (!box) return;
  box.classList.remove("show");
}

function initMap() {
  map = L.map("map", { zoomControl: false }).setView([18.5204, 73.8567], 12);
  L.control.zoom({ position: "bottomright" }).addTo(map);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  }).addTo(map);
}

function makeIcon(kind) {
  const neededClass = kind === "needed" ? "needed" : "";
  const iconName = kind === "needed" ? "person_search" : "home_work";
  return L.divIcon({
    className: "tingo-marker",
    html: `
      <div class="marker-container">
        <div class="marker-wave ${neededClass}"></div>
        <div class="marker-wave ${neededClass}"></div>
        <div class="marker-wave ${neededClass}"></div>
        <div class="marker-dot ${neededClass}"><span class="material-symbols-rounded">${iconName}</span></div>
      </div>
    `,
    iconSize: [34, 34],
    iconAnchor: [17, 34],
    popupAnchor: [0, -28]
  });
}

function makeUserIcon() {
  return L.divIcon({
    className: "tingo-user-marker",
    html: `
      <div class="tingo-user-wrap">
        <img class="tingo-user-avatar" src="${TINGO_CHARACTER_IMG}" alt="Tingoo">
        <div class="tingo-user-label">You</div>
      </div>
    `,
    iconSize: [58, 68],
    iconAnchor: [29, 64],
    popupAnchor: [0, -58]
  });
}


function keepUserLocationVisible() {
  if (!map || !userLocation || !isValidCoord(userLocation.lat, userLocation.lng)) return;
  if (userMarker) {
    try {
      userMarker.setLatLng([userLocation.lat, userLocation.lng]).addTo(map);
      if (userMarker.setZIndexOffset) userMarker.setZIndexOffset(1000);
    } catch (e) {}
  } else {
    userMarker = L.marker([userLocation.lat, userLocation.lng], { icon: makeUserIcon(), zIndexOffset: 1000 }).addTo(map);
  }
  if (userMarker && userMarker.bringToFront) userMarker.bringToFront();
}

function makeSearchIcon() {
  return L.divIcon({
    className: "tingo-search-area-marker",
    html: `<div class="tingo-search-marker"><span class="material-symbols-rounded">place</span></div>`,
    iconSize: [38, 38],
    iconAnchor: [19, 38],
    popupAnchor: [0, -32]
  });
}

function clearSearchArea() {
  if (!map) return;
  if (searchAreaCircle) {
    map.removeLayer(searchAreaCircle);
    searchAreaCircle = null;
  }
  if (searchAreaMarker) {
    map.removeLayer(searchAreaMarker);
    searchAreaMarker = null;
  }
}

function drawSearchArea(target, queryText = "") {
  clearSearchArea();
  const normalizedTarget = normalizeSearchTarget(target);
  if (!map || !normalizedTarget) return;

  const fromYouText = userLocation && isValidCoord(userLocation.lat, userLocation.lng)
    ? `<br><span style="color:#0EA5E9;font-size:11px;font-weight:900;">From you: ${escapeHtml(formatKm(distanceKm(userLocation.lat, userLocation.lng, normalizedTarget.lat, normalizedTarget.lng)))}</span>`
    : "";

  const label = normalizedTarget.label || queryText || "Searched area";

  searchAreaCircle = L.circle([normalizedTarget.lat, normalizedTarget.lng], {
    radius: SEARCH_AREA_RADIUS_METERS,
    color: "#DC2626",
    weight: 2.5,
    opacity: 0.9,
    fillColor: "#DC2626",
    fillOpacity: 0.18,
    dashArray: "7,8"
  }).addTo(map);

  searchAreaMarker = L.marker([normalizedTarget.lat, normalizedTarget.lng], { icon: makeSearchIcon(), zIndexOffset: 900 })
    .addTo(map)
    .bindPopup(`<b>Searched area</b><br><span style="color:#64748B;font-size:11px;font-weight:800;">${escapeHtml(label)}</span>${fromYouText}`);
}

function focusSearchAreaOnMap(target, posts = [], zoomToTarget = false) {
  const normalizedTarget = normalizeSearchTarget(target);
  if (!map || !normalizedTarget) return;

  // When a suggestion is explicitly selected, zoom directly to that exact area.
  // This keeps the map focused on the chosen place instead of zooming out to
  // include the user's location or nearby posts.
  if (zoomToTarget) {
    map.stop();
    map.setView([normalizedTarget.lat, normalizedTarget.lng], 16, { animate: true });
    map.invalidateSize();
    keepUserLocationVisible();
    return;
  }

  const bounds = L.latLngBounds(
    [normalizedTarget.lat, normalizedTarget.lng],
    [normalizedTarget.lat, normalizedTarget.lng]
  );

  // Add a small buffer so the selected area is zoomed in clearly.
  const buffer = 0.01;
  bounds.extend([normalizedTarget.lat + buffer, normalizedTarget.lng + buffer]);
  bounds.extend([normalizedTarget.lat - buffer, normalizedTarget.lng - buffer]);

  (posts || []).slice(0, 8).forEach(post => {
    const coords = getPostCoords(post);
    if (coords) bounds.extend([coords.lat, coords.lng]);
  });

  if (userLocation && isValidCoord(userLocation.lat, userLocation.lng)) {
    bounds.extend([userLocation.lat, userLocation.lng]);
  }

  map.fitBounds(bounds, {
    paddingTopLeft: [28, 145],
    paddingBottomRight: [28, 132],
    maxZoom: 14
  });
}

function formatKm(km) {
  if (!Number.isFinite(km)) return "";
  if (km < 0.15) return "0 km";
  if (km < 1) return `${Math.round(km * 1000)} m`;
  return `${km.toFixed(km < 10 ? 1 : 0)} km`;
}

function distanceLabel(post) {
  const searchKm = Number(post?._distanceKm);
  const userKm = Number(post?._distanceFromUserKm);
  if (Number.isFinite(searchKm)) return `${formatKm(searchKm)} from your search location`;
  if (Number.isFinite(userKm)) return `${formatKm(userKm)} from you`;
  return "";
}

function popupDistanceHtml(post) {
  const lines = [];
  if (Number.isFinite(Number(post?._distanceFromUserKm))) {
    lines.push(`<span style="color:#0EA5E9;font-size:11px;font-weight:900;">From you: ${escapeHtml(formatKm(Number(post._distanceFromUserKm)))}</span>`);
  }
  if (Number.isFinite(Number(post?._distanceKm))) {
    lines.push(`<span style="color:#EF4444;font-size:11px;font-weight:900;">From your search location: ${escapeHtml(formatKm(Number(post._distanceKm)))}</span>`);
  }
  return lines.length ? `<br>${lines.join("<br>")}` : "";
}

function getModePosts() {
  return allPosts.filter(post => activeMode === "all" || post.kind === activeMode);
}

function addPostDistances(posts, searchTarget = null) {
  return (posts || []).map(post => {
    const coords = getPostCoords(post);
    const copy = { ...post };
    if (coords && userLocation && isValidCoord(userLocation.lat, userLocation.lng)) {
      copy._distanceFromUserKm = distanceKm(userLocation.lat, userLocation.lng, coords.lat, coords.lng);
    } else {
      copy._distanceFromUserKm = Number.POSITIVE_INFINITY;
    }
    if (coords && searchTarget && isValidCoord(searchTarget.lat, searchTarget.lng)) {
      copy._distanceKm = distanceKm(searchTarget.lat, searchTarget.lng, coords.lat, coords.lng);
    } else {
      copy._distanceKm = Number.POSITIVE_INFINITY;
    }
    return copy;
  });
}

function dedupePosts(posts) {
  const seen = new Set();
  const out = [];
  (posts || []).forEach(post => {
    const key = `${post.kind || ""}:${post.id}`;
    if (seen.has(key)) return;
    seen.add(key);
    out.push(post);
  });
  return out;
}

function sortByDistanceThenRecent(posts, mode = "search") {
  return [...posts].sort((a, b) => {
    const key = mode === "user" ? "_distanceFromUserKm" : "_distanceKm";
    const da = Number.isFinite(a[key]) ? a[key] : Number.POSITIVE_INFINITY;
    const db = Number.isFinite(b[key]) ? b[key] : Number.POSITIVE_INFINITY;
    if (Math.abs(da - db) > 0.01) return da - db;
    const ua = Number.isFinite(a._distanceFromUserKm) ? a._distanceFromUserKm : Number.POSITIVE_INFINITY;
    const ub = Number.isFinite(b._distanceFromUserKm) ? b._distanceFromUserKm : Number.POSITIVE_INFINITY;
    if (Math.abs(ua - ub) > 0.01) return ua - ub;
    return new Date(b.updated_at || b.created_at || 0) - new Date(a.updated_at || a.created_at || 0);
  });
}

function includesSmart(value, searchText) {
  const text = String(value || "").toLowerCase();
  const q = String(searchText || "").toLowerCase();
  if (!q) return true;
  if (text.includes(q)) return true;
  const tokens = q.split(" ").filter(Boolean);
  return tokens.every(token => text.includes(token));
}

function postMatchesSearchText(post, searchText) {
  if (!searchText) return true;
  return [
    post.title,
    post.location,
    post.type,
    post.description,
    post.brokerage_type,
    post.rent,
    post.budget,
    post.preferred_location
  ].some(value => includesSmart(value, searchText));
}

async function geocodeMapLocation(text) {
  const locationText = cleanSearchTerm(text);
  if (!locationText) return null;

  const cacheKey = "map_geo_v2_" + locationText.toLowerCase();
  try {
    const cached = JSON.parse(localStorage.getItem(cacheKey) || "null");
    if (cached && isValidCoord(cached.lat, cached.lng)) return cached;
  } catch (e) {}

  const GEO_SEARCH_CONTEXTS = [
    "Pune, Maharashtra, India",
    "Pimpri-Chinchwad, Pune, Maharashtra, India",
    "Maharashtra, India",
    "India",
    ""
  ];

  const queryVariants = GEO_SEARCH_CONTEXTS
    .map(context => cleanSearchTerm(context ? `${locationText} ${context}` : locationText))
    .filter(Boolean);

  try {
    const responses = await Promise.allSettled(queryVariants.map(query => {
      const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=4&accept-language=en&q=${encodeURIComponent(query)}`;
      return fetch(url, { headers: { "Accept": "application/json" } }).then(response => response.json());
    }));

    const flat = [];
    responses.forEach(result => {
      if (result.status === "fulfilled" && Array.isArray(result.value)) {
        flat.push(...result.value);
      }
    });

    const first = flat.find(place => isValidCoord(place.lat, place.lon));
    if (!first) return null;

    const result = normalizeSearchTarget({
      label: first.display_name ? String(first.display_name).split(",")[0] : locationText,
      subLabel: first.display_name || locationText,
      lat: Number(first.lat),
      lng: Number(first.lon),
      lon: Number(first.lon),
      displayName: first.display_name || locationText
    });

    if (isValidCoord(result.lat, result.lon)) {
      localStorage.setItem(cacheKey, JSON.stringify(result));
      return result;
    }
    return null;
  } catch (err) {
    console.warn("Map geocoding error", err);
    return null;
  }
}

async function resolveSearchTarget(searchText) {
  const selected = normalizeSearchTarget(selectedMapPlace);
  if (selected) return selected;
  return await geocodeMapLocation(searchText);
}

async function getFilteredMapPosts() {
  const q = cleanSearchTerm(document.getElementById("mapSearch")?.value || "");
  const base = getModePosts();

  currentSearchTarget = null;

  if (!q) {
    const withUserDistance = addPostDistances(base, null);
    if (userLocation && isValidCoord(userLocation.lat, userLocation.lng)) {
      hideMapStatus();
      return sortByDistanceThenRecent(withUserDistance, "user");
    }
    hideMapStatus();
    return withUserDistance;
  }

  const target = await resolveSearchTarget(q);
  currentSearchTarget = normalizeSearchTarget(target);

  const withDistance = addPostDistances(base, currentSearchTarget);
  const textMatches = withDistance.filter(post => postMatchesSearchText(post, q));

  let nearbyMatches = [];
  if (currentSearchTarget) {
    nearbyMatches = withDistance.filter(post => Number.isFinite(post._distanceKm) && post._distanceKm <= 35);
    if (!nearbyMatches.length) {
      nearbyMatches = withDistance.filter(post => Number.isFinite(post._distanceKm) && post._distanceKm <= 80);
    }
  }

  let merged = dedupePosts([...textMatches, ...nearbyMatches]);

  if (currentSearchTarget) {
    merged = sortByDistanceThenRecent(merged, "search");
  } else if (userLocation && isValidCoord(userLocation.lat, userLocation.lng)) {
    merged = sortByDistanceThenRecent(merged, "user");
  }

  if (merged.length) {
    const hasExact = textMatches.length > 0;
    showMapStatus(hasExact
      ? `Showing matching posts and nearby ${activeMode === "all" ? "available/needed" : activeMode} posts.`
      : `No exact saved address found for “${q}”. Showing nearby ${activeMode === "all" ? "available/needed" : activeMode} posts by distance.`);
    return merged;
  }

  // Fallback: no matches at all – show nearby posts relative to search location if available.
  const fallback = addPostDistances(base, currentSearchTarget); // use the target for distance
  const sortedFallback = currentSearchTarget
    ? sortByDistanceThenRecent(fallback, "search")
    : (userLocation && isValidCoord(userLocation.lat, userLocation.lng)
        ? sortByDistanceThenRecent(fallback, "user")
        : fallback);

  const nearbyText = currentSearchTarget ? "nearby " : "";
  showMapStatus(`No result found for “${q}”. Showing all ${nearbyText}existing ${activeMode === "all" ? "available rooms and requirements" : activeMode + " posts"} instead.`);

  // Keep the search area visible if we have a target.
  if (currentSearchTarget) {
    drawSearchArea(currentSearchTarget, q);
  } else {
    clearSearchArea();
  }

  return sortedFallback;
}

async function loadMapPosts() {
  const [availableResult, neededResult] = await Promise.all([
    db.from("room_posts")
      .select("*")
      .eq("status", "active")
      .order("created_at", { ascending: false }),
    db.from("room_requirements")
      .select("*")
      .order("created_at", { ascending: false })
  ]);

  if (availableResult.error) console.warn("Available map load error", availableResult.error);
  if (neededResult.error) console.warn("Needed map load error", neededResult.error);

  const available = (availableResult.data || []).map(item => ({ ...item, kind: "available" }));
  const needed = (neededResult.data || [])
    .filter(item => !String(item.status || "").toLowerCase().startsWith("inactive"))
    .map(item => ({ ...item, kind: "needed" }));

  allPosts = [...available, ...needed].filter(post => isValidCoord(post.latitude, post.longitude));
  renderMap();
}

function filteredPosts() {
  return visibleMapPosts;
}

async function renderMap(options = {}) {
  const requestId = ++mapRenderRequestId;
  const posts = await getFilteredMapPosts();
  if (requestId !== mapRenderRequestId) return;

  visibleMapPosts = posts;

  markers.forEach(marker => map.removeLayer(marker));
  markers = [];

  const bounds = [];
  const q = cleanSearchTerm(document.getElementById("mapSearch")?.value || "");
  const hasSearch = Boolean(q);

  // Draw search area if we have a target (even in fallback, we keep it)
  if (hasSearch && currentSearchTarget) {
    drawSearchArea(currentSearchTarget, q);
  } else {
    clearSearchArea();
  }

  posts.forEach(post => {
    const coords = getPostCoords(post);
    if (!coords) return;

    const lat = Number(coords.lat);
    const lng = Number(coords.lng);
    const label = post.kind === "needed" ? "Room Needed" : `₹${post.rent || "-"}`;
    const typeText = post.type || (post.kind === "needed" ? "Requirement" : "Property");
    const distHtml = popupDistanceHtml(post);

    const popupHtml = `
      <div class="popup-title">${escapeHtml(post.title || "Untitled Post")}</div>
      <div class="popup-sub">${escapeHtml(label)} • ${escapeHtml(typeText)}<br>${escapeHtml(post.location || "Location")}${distHtml}</div>
      <button class="popup-btn" onclick="window.location.href='${postUrl(post)}'">View Details</button>
    `;

    const marker = L.marker([lat, lng], { icon: makeIcon(post.kind) })
      .addTo(map)
      .bindPopup(popupHtml);

    marker.on("click", () => highlightCard(post.id));
    markers.push(marker);
    bounds.push([lat, lng]);
  });

  // Zoom to show search area and nearby posts
  keepUserLocationVisible();
  if (hasSearch && currentSearchTarget) {
    focusSearchAreaOnMap(currentSearchTarget, posts, options.zoomToTarget === true);
  } else if (posts.length && userLocation && isValidCoord(userLocation.lat, userLocation.lng)) {
    const nearBounds = [[userLocation.lat, userLocation.lng]];
    posts.slice(0, 10).forEach(post => {
      const coords = getPostCoords(post);
      if (coords && (!Number.isFinite(post._distanceFromUserKm) || post._distanceFromUserKm <= 20 || nearBounds.length < 5)) {
        nearBounds.push([coords.lat, coords.lng]);
      }
    });
    map.fitBounds(nearBounds, { paddingTopLeft: [28, 145], paddingBottomRight: [28, 132], maxZoom: 14 });
  } else if (bounds.length) {
    map.fitBounds(bounds, { paddingTopLeft: [24, 130], paddingBottomRight: [24, 130], maxZoom: 14 });
  }
}

// ─── NAVIGATION ───
let __tingoNavigationLock = false;

function prepareForNavigation() {
  try { if (typeof closeNotifications === "function") closeNotifications(); } catch (e) {}
  try { if (window.parent && window.parent !== window && typeof window.parent.closeNotifications === "function") {
    window.parent.closeNotifications();
  }} catch (e) {}
  hideSuggestionBox();
  document.querySelectorAll(".app-toast.show, .map-status.show").forEach(el => el.classList.remove("show"));
}

function go(page) {
  if (__tingoNavigationLock) return;
  __tingoNavigationLock = true;
  prepareForNavigation();

  if (window.self !== window.top) {
    try {
      if (parent && typeof parent.openPanel === "function" && parent.innerWidth >= 900) {
        parent.openPanel(page);
        return;
      }
    } catch (e) {}
  }

  requestAnimationFrame(() => {
    window.location.replace(page);
  });
}

function checkLogin(page) {
  if (String(page || "").includes("postroom.html")) {
    go(page);
    return;
  }
  const user = safeJson(localStorage.getItem("user"));
  if (!user) {
    window.location.href = `user.html?redirect=${encodeURIComponent(page)}`;
    return;
  }
  go(page);
}

function openChatList() {
  const user = safeJson(localStorage.getItem("user"));
  if (!user) {
    window.location.href = "user.html?redirect=chatlist";
    return;
  }
  go("chat.html");
}

// ─── MSG BADGE ───
function setMsgBadge(count) {
  const badge = document.getElementById("msgBadge");
  if (!badge) return;
  const number = Number(count || 0);
  if (number > 0) {
    badge.innerText = number > 99 ? "99+" : String(number);
    badge.style.display = "block";
  } else {
    badge.innerText = "";
    badge.style.display = "none";
  }
}

window.setMsgBadge = setMsgBadge;

async function checkNewMessages() {
  const user = getStoredUser();
  if (!user) return;
  try {
    const result = await db.from("messages").select("sender_id,room_id").eq("receiver_id", user.id).eq("is_read", false);
    if (!result.data) { setMsgBadge(0); return; }
    const unique = new Set();
    result.data.forEach(m => unique.add(m.sender_id + "_" + m.room_id));
    setMsgBadge(unique.size);
  } catch (_) { setMsgBadge(0); }
}

// ─── SET ACTIVE NAV ───
function setActiveNavItem() {
  const page = (window.location.pathname.split("/").pop() || "map.html").toLowerCase();
  document.querySelectorAll(".nav-item").forEach(item => {
    const pages = (item.getAttribute("data-pages") || "").toLowerCase().split(",");
    item.classList.toggle("active", pages.includes(page));
  });
}
